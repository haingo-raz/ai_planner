[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-agent"
version = "0.1.0"
description = "Personalised recipe discovery agent built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
recipe-agent = "src.api:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]