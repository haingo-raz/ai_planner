services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command:
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./prompts:/app/prompts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8501:8501"]
    depends_on: [backend]
    environment:
      API_BASE_URL: http://backend:8000
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
    volumes:
      - ./frontend:/app/frontend
